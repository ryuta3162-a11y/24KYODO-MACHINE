<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>経堂 配置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong id="brand-title">経堂 2F A</strong>
      <select id="floor-select" class="floor-select" title="フロア・パターン切替" aria-label="フロア・パターン切替">
        <option value="kyodo-2f">2階A</option>
        <option value="kyodo-2f-b">2階B</option>
        <option value="kyodo-2f-c">2階C</option>
        <option value="kyodo-3f">3階A</option>
        <option value="kyodo-3f-b">3階B</option>
        <option value="kyodo-3f-c">3階C</option>
      </select>
      <input id="author" class="author" type="text" maxlength="40" placeholder="名前" />
    </div>
    <div class="actions">
      <button type="button" id="btn-rotate" class="btn" disabled>回転</button>
      <button type="button" id="btn-lock" class="btn" disabled title="選択したマシンの位置を固定／解除">ロック</button>
      <button type="button" id="btn-edit-machine" class="btn" disabled title="選択したマシンのサイズ・内容を変更（配置は維持）">変更</button>
      <button type="button" id="btn-save" class="btn primary">保存</button>
    </div>
  </header>

  <div class="zonebar" id="zonebar">
    <span class="zonebar-title">ゾーン</span>
    <button type="button" class="btn zone-tool" id="btn-zone-rect" data-tool="rect" title="ドラッグで四角ゾーンを追加">□ 四角</button>
    <button type="button" class="btn active" id="btn-zone-off" title="ゾーンを選んで移動・変形">選択</button>
    <button type="button" class="btn" id="btn-zone-vertical" title="縦書き切替" disabled>縦書</button>
    <button type="button" class="btn" id="btn-zone-flip-x" title="左右反転" disabled>左右</button>
    <button type="button" class="btn" id="btn-zone-flip-y" title="上下反転" disabled>上下</button>
    <label class="zone-label-wrap">
      名称
      <input id="zone-label" type="text" maxlength="40" placeholder="例: レジスタンス" />
    </label>
    <div class="zone-colors" id="zone-colors" role="listbox" aria-label="ゾーン色"></div>
    <label class="zone-freetext-wrap" title="文字を入れて図面をダブルクリックで配置">
      文字
      <input id="zone-freetext" type="text" maxlength="80" placeholder="ダブルクリックで配置" />
    </label>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <label class="search">
        <input id="search" type="search" placeholder="検索" />
      </label>
      <div class="filters source-filters" id="source-filters">
        <button type="button" class="chip active" data-source="existing">既存</button>
        <button type="button" class="chip" data-source="new">新規</button>
      </div>
      <button type="button" id="btn-add-machine" class="btn add-machine-btn">＋ マシン追加</button>
      <div class="filters" id="filters">
        <button type="button" class="chip active" data-genre="all">すべて</button>
        <button type="button" class="chip" data-genre="web">WEB追加</button>
        <button type="button" class="chip" data-genre="cardio">有酸素</button>
        <button type="button" class="chip" data-genre="stack">レジスタンス</button>
        <button type="button" class="chip" data-genre="plate">PL</button>
        <button type="button" class="chip" data-genre="freeweight">FW</button>
        <button type="button" class="chip" data-genre="pilates">ピラティス</button>
        <button type="button" class="chip" data-genre="hyrox">HYROX</button>
      </div>
      <div id="palette" class="palette"></div>
    </aside>

    <main class="viewport" id="viewport">
      <div class="stage" id="stage">
        <img
          id="floor"
          class="floor"
          src="../floorplan/floor_2f.jpg"
          alt="2F"
          draggable="false"
          width="3388"
          height="2058"
        />
        <div id="zones-layer" class="zones-layer"></div>
        <div id="machines-layer" class="machines-layer"></div>
        <div id="guides-layer" class="guides-layer" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status-save" class="status-save is-saved" title="保存状態">保存済み</span>
    <span id="status-room">room</span>
    <span id="status-scale">—</span>
    <span id="status-count">0</span>
    <span id="status-sel"></span>
    <a id="status-link" class="status-link" hidden target="_blank" rel="noopener noreferrer"></a>
  </footer>

  <div id="add-machine-modal" class="add-machine-modal" hidden>
    <div class="add-machine-card" role="dialog" aria-modal="true" aria-labelledby="add-machine-title">
      <h2 id="add-machine-title">マシン追加</h2>
      <p class="add-machine-lead" id="add-machine-lead">スプレッドシート「追加マシン」に保存され、すぐ配置一覧に反映されます。</p>
      <form id="add-machine-form" class="add-machine-form">
        <input type="hidden" name="edit_id" id="add-machine-edit-id" value="" />
        <label class="add-field">
          名称 <span class="req">必須</span>
          <input name="name" type="text" maxlength="120" required placeholder="例: レッグプレス" />
        </label>
        <label class="add-field">
          商品URL
          <input name="link" type="url" maxlength="500" placeholder="https://..." />
        </label>
        <div class="add-row">
          <label class="add-field">
            幅 cm <span class="req">必須</span>
            <input name="width_cm" type="number" min="10" max="9999" required />
          </label>
          <label class="add-field">
            奥行 cm <span class="req">必須</span>
            <input name="length_cm" type="number" min="10" max="9999" required />
          </label>
          <label class="add-field">
            台数
            <input name="qty" type="number" min="1" max="99" value="1" />
          </label>
        </div>
        <div class="add-row">
          <label class="add-field">
            区分
            <select name="source">
              <option value="new">新規マシン</option>
              <option value="existing">既存マシン</option>
            </select>
          </label>
          <label class="add-field">
            ジャンル
            <select name="genre">
              <option value="stack">レジスタンス</option>
              <option value="freeweight">FW</option>
              <option value="plate">PL</option>
              <option value="cardio">有酸素</option>
              <option value="hyrox">HYROX</option>
              <option value="pilates">ピラティス</option>
            </select>
          </label>
        </div>
        <label class="add-field">
          マシン画像 <span class="req" id="add-machine-image-req">必須</span>
          <input id="add-machine-image" name="image" type="file" accept="image/*" required />
          <span class="add-hint" id="add-machine-image-hint" hidden>変更時は空欄のままなら画像を維持します</span>
        </label>
        <img id="add-machine-preview" class="add-machine-preview" alt="" hidden />
        <label class="add-field">
          登録者
          <input id="add-machine-by" name="by" type="text" maxlength="40" placeholder="名前" />
        </label>
        <label class="add-field">
          備考
          <input name="note" type="text" maxlength="200" placeholder="任意" />
        </label>
        <div class="add-machine-actions">
          <button type="button" id="add-machine-cancel" class="btn">キャンセル</button>
          <button type="submit" class="btn primary" id="add-machine-submit">登録する</button>
        </div>
      </form>
    </div>
  </div>

  <div id="conflict-modal" class="conflict-modal" hidden>
    <div class="conflict-card" role="dialog" aria-modal="true" aria-labelledby="conflict-title">
      <h2 id="conflict-title">保存の競合</h2>
      <p>他の画面で先に保存されています。どちらを残しますか？</p>
      <div class="conflict-actions">
        <button type="button" id="conflict-keep-mine" class="btn primary">この画面で上書き</button>
        <button type="button" id="conflict-take-server" class="btn">サーバ版を読む</button>
        <button type="button" id="conflict-later" class="btn">あとで</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
