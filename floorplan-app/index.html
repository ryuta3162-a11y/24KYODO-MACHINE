<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>経堂 2F 配置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>経堂 2F</strong>
      <input id="author" class="author" type="text" maxlength="40" placeholder="名前" />
    </div>
    <div class="actions">
      <button type="button" id="btn-fit" class="btn">全体</button>
      <button type="button" id="btn-rotate" class="btn" disabled>回転</button>
      <button type="button" id="btn-dup" class="btn" disabled>複製</button>
      <button type="button" id="btn-del" class="btn danger" disabled>削除</button>
      <button type="button" id="btn-save" class="btn primary">保存</button>
      <button type="button" id="btn-share" class="btn">共有</button>
      <button type="button" id="btn-reload" class="btn">最新</button>
      <select id="history" class="history" title="変更履歴">
        <option value="">履歴</option>
      </select>
      <button type="button" id="btn-clear" class="btn">クリア</button>
      <button type="button" id="btn-export" class="btn">PNG</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <label class="search">
        <input id="search" type="search" placeholder="検索" />
      </label>
      <div class="filters source-filters" id="source-filters">
        <button type="button" class="chip active" data-source="existing">既存</button>
        <button type="button" class="chip" data-source="new">新規</button>
      </div>
      <div class="filters" id="filters">
        <button type="button" class="chip active" data-genre="all">すべて</button>
        <button type="button" class="chip" data-genre="cardio">有酸素</button>
        <button type="button" class="chip" data-genre="hyrox">HYROX</button>
        <button type="button" class="chip" data-genre="stack">スタック</button>
        <button type="button" class="chip" data-genre="plate">プレート</button>
        <button type="button" class="chip" data-genre="freeweight">FW</button>
      </div>
      <div id="palette" class="palette"></div>
    </aside>

    <main class="viewport" id="viewport">
      <div class="stage" id="stage">
        <img
          id="floor"
          class="floor"
          src="../floorplan/floor_2f.jpg"
          alt="2F"
          draggable="false"
          width="3388"
          height="2058"
        />
        <div id="machines-layer" class="machines-layer"></div>
        <div id="guides-layer" class="guides-layer" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status-room">room</span>
    <span id="status-scale">—</span>
    <span id="status-count">0</span>
    <span id="status-sel"></span>
    <a id="status-link" class="status-link" hidden target="_blank" rel="noopener noreferrer"></a>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
