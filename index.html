<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYFIT24経堂 - マシンラインナップ</title>
    
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        joyred: '#A63646',
                        joybg: '#F3F4F6',
                        joypanel: '#FFFFFF',
                        joygray: '#E5E7EB',
                        joytext: '#111827',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; background-color: #F3F4F6; color: #111827; }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(1200px 600px at 50% -10%, rgba(166, 54, 70, 0.07), transparent 60%),
                radial-gradient(900px 500px at 10% 20%, rgba(255, 255, 255, 0.9), transparent 55%),
                radial-gradient(900px 500px at 90% 20%, rgba(255, 255, 255, 0.7), transparent 55%);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes popUpFade {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-up {
            opacity: 0;
            animation: popUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modern-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
        }
        .modern-badge span {
            display: block;
            line-height: 1;
            transform: translateY(1px);
            letter-spacing: -0.05em;
            margin-right: -0.05em;
        }

        .machine-card {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .machine-card.show { opacity: 1; transform: translateY(0); }
        .machine-card:hover { transform: translateY(-5px); }

        .img-blend {
            mix-blend-mode: multiply;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: subpixel-antialiased;
        }
    </style>
</head>
<body class="bg-joybg text-joytext flex min-h-screen overflow-x-hidden selection:bg-joyred selection:text-white">

    <button id="open-sidebar-btn" class="fixed top-4 left-4 z-[60] bg-joypanel text-joytext p-3 rounded-full border border-joygray hover:text-joyred transition-all duration-300 hidden group shadow-md">
        <i data-lucide="menu" class="w-6 h-6 transform group-hover:scale-110 transition-transform"></i>
    </button>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-transparent z-[70] flex flex-col transition-transform duration-500 ease-in-out pointer-events-none">
        <div class="h-full w-full p-4 pointer-events-auto flex flex-col">
            <div class="bg-joypanel border border-joygray rounded-2xl flex flex-col h-full shadow-lg relative overflow-hidden">
                <button id="close-sidebar-btn" class="absolute top-4 right-4 text-gray-400 hover:text-joyred bg-joybg hover:bg-gray-100 rounded-full p-1.5 transition-colors duration-300 z-50 shadow-sm border border-joygray">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <div class="pt-8 pb-4 flex flex-col items-center justify-center flex-shrink-0 border-b border-joygray bg-joybg">
                    <span class="text-xl font-black text-joyred tracking-widest mb-1">JOYFIT24</span>
                    <span class="text-sm font-bold text-joytext tracking-widest">経堂</span>
                </div>

                <nav id="area-menu" class="flex flex-col flex-grow p-3 gap-3 overflow-y-auto no-scrollbar">
                    <!-- JSで生成 -->
                </nav>
            </div>
        </div>
    </aside>

    <main id="main-content" class="ml-64 flex-1 min-w-0 flex flex-col transition-all duration-500 ease-in-out relative z-10">
        
        <div class="relative w-full bg-joypanel py-12 md:py-20 px-4 flex flex-col items-center justify-center border-b-[8px] border-joyred overflow-hidden z-20 shadow-sm">
            
            <div class="relative z-30 animate-pop-up flex flex-col items-center mb-4 w-full text-center">
                <h1 class="font-black text-4xl sm:text-5xl md:text-6xl lg:text-[5.5rem] tracking-widest leading-tight mb-2 text-joyred">JOYFIT24</h1>
                <span class="font-bold text-3xl sm:text-4xl md:text-5xl lg:text-[4rem] tracking-wider leading-tight text-joytext">経堂</span>
            </div>
            
            <div class="relative z-30 animate-pop-up mb-4 w-full text-center px-2" style="animation-delay: 0.1s;">
                <h2 class="font-black text-2xl sm:text-3xl md:text-5xl lg:text-[4rem] leading-tight tracking-wider text-joytext whitespace-nowrap">
                    マシンラインナップ
                </h2>
            </div>
        </div>

        <div class="relative z-10 overflow-hidden min-h-screen">
            
            <div class="px-3 md:px-10 lg:px-16 py-12 md:py-20 relative z-20">
                <div class="mb-10 md:mb-14 flex flex-col items-center justify-center">
                    <div class="relative px-6 md:px-10 py-3 md:py-4 bg-joypanel border border-joygray rounded-full shadow-md flex items-center justify-center transition-all duration-500 mb-3 md:mb-4">
                        <h2 id="current-area-title" class="text-xl md:text-3xl font-black tracking-widest text-joytext flex items-center gap-3">
                            <!-- JSで挿入 -->
                        </h2>
                    </div>
                </div>
                
                <div id="machine-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 md:gap-6 relative z-30">
                    <!-- JSで生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const gymData = [
            { id: 'cardio', title: '有酸素マシン', items: [
                { imgBase: 'cardio_1' },
                { imgBase: 'cardio_2' },
                { imgBase: 'cardio_3' }
            ]},
            { id: 'resistance', title: 'ウェイトマシン', items: [
                { imgBase: 'resistance_1' },
                { imgBase: 'resistance_2' },
                { imgBase: 'resistance_3' },
                { imgBase: 'resistance_4' },
                { imgBase: 'resistance_5' },
                { imgBase: 'resistance_6' },
                { imgBase: 'resistance_7' },
                { imgBase: 'resistance_8' },
                { imgBase: 'resistance_9' },
                { imgBase: 'resistance_10' },
                { imgBase: 'resistance_11' },
                { imgBase: 'resistance_12' },
                { imgBase: 'resistance_13' },
                { imgBase: 'resistance_14' },
                { imgBase: 'resistance_15' }
            ]},
            { id: 'freeweight', title: 'フリーウェイト', items: [
                { imgBase: 'freeweight_1' },
                { imgBase: 'freeweight_2' },
                { imgBase: 'freeweight_3' },
                { imgBase: 'freeweight_4' },
                { imgBase: 'freeweight_5' },
                { imgBase: 'freeweight_6' },
                { imgBase: 'freeweight_7' },
                { imgBase: 'freeweight_8' },
                { imgBase: 'freeweight_9' },
                { imgBase: 'freeweight_10' },
                { imgBase: 'freeweight_11' },
                { imgBase: 'freeweight_12' }
            ]}
        ];

        const menuContainer = document.getElementById('area-menu');
        const gridContainer = document.getElementById('machine-grid');
        const titleContainer = document.getElementById('current-area-title');
        
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const openBtn = document.getElementById('open-sidebar-btn');
        const closeBtn = document.getElementById('close-sidebar-btn');

        let currentActiveId = null;

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                if (window.innerWidth >= 768) {
                    mainContent.classList.add('ml-64');
                    mainContent.classList.remove('ml-0');
                }
                openBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('ml-64');
                mainContent.classList.add('ml-0');
                openBtn.classList.remove('hidden');
            }
        }

        openBtn.addEventListener('click', () => toggleSidebar(true));
        closeBtn.addEventListener('click', () => toggleSidebar(false));

        if (window.innerWidth < 768) toggleSidebar(false);

        function buildMenu() {
            gymData.forEach((area, index) => {
                const btn = document.createElement('button');
                btn.className = `w-full block focus:outline-none mb-2 rounded-full transition-all duration-300 relative group bg-joypanel border border-joygray hover:border-joyred shadow-sm`;
                
                const numText = String(index + 1).padStart(2, '0');
                
                btn.innerHTML = `
                    <div class="relative z-10 px-2 py-2 flex items-center justify-start gap-3 transition-colors duration-300">
                        <div class="menu-num w-8 h-8 modern-badge text-sm transition-all duration-300 flex-shrink-0" style="background-color: #6B7280;">
                            <span class="font-black">${numText}</span>
                        </div>
                        <span class="menu-text text-xs md:text-sm font-bold tracking-widest transition-colors duration-300 text-left text-gray-500 group-hover:text-joyred">${area.title}</span>
                    </div>
                `;
                
                btn.onclick = () => selectArea(area.id, btn, index);
                menuContainer.appendChild(btn);

                if (index === 0) selectArea(area.id, btn, index);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function selectArea(id, selectedBtn, index) {
            if (currentActiveId === id) return;
            currentActiveId = id;

            const allBtns = menuContainer.querySelectorAll('button');
            allBtns.forEach(btn => {
                const numBadge = btn.querySelector('.menu-num');
                const textSpan = btn.querySelector('.menu-text');
                
                if (btn === selectedBtn) {
                    btn.classList.add('bg-red-50', 'border-joyred');
                    btn.classList.remove('border-joygray', 'bg-joypanel');
                    numBadge.style.backgroundColor = '#A63646';
                    numBadge.style.transform = 'scale(1.1)';
                    textSpan.classList.add('text-joyred');
                    textSpan.classList.remove('text-gray-500');
                } else {
                    btn.classList.remove('bg-red-50', 'border-joyred');
                    btn.classList.add('border-joygray', 'bg-joypanel');
                    numBadge.style.backgroundColor = '#6B7280';
                    numBadge.style.transform = 'scale(1)';
                    textSpan.classList.remove('text-joyred');
                    textSpan.classList.add('text-gray-500');
                }
            });

            const areaData = gymData.find(a => a.id === id);
            
            titleContainer.parentElement.style.opacity = '0';
            setTimeout(() => {
                const numText = String(index + 1).padStart(2, '0');
                titleContainer.innerHTML = `
                    <div class="w-8 h-8 md:w-10 md:h-10 modern-badge text-base md:text-xl flex-shrink-0 font-black shadow-sm" style="background-color: #A63646;">
                        <span>${numText}</span>
                    </div>
                    <span class="font-black">${areaData.title}</span>
                `;
                titleContainer.parentElement.style.opacity = '1';
            }, 200);

            gridContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();

            areaData.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `machine-card group cursor-default shadow-sm hover:shadow-lg transition-shadow bg-joypanel rounded-xl border border-joygray`;

                let imgHTML = `<img src="${item.imgBase}.jpg" alt="マシン画像" onerror="this.onerror=null;this.src='https://placehold.co/400x300/f4f4f5/999999?text=Image';" class="w-full h-full object-contain p-2 img-blend group-hover:scale-105 transition-transform duration-500 ease-out relative z-10">`;

                card.innerHTML = `
                    <div class="relative aspect-[4/3] flex items-center justify-center overflow-hidden">
                        ${imgHTML}
                    </div>
                `;

                fragment.appendChild(card);
                setTimeout(() => card.classList.add('show'), 30 * idx);
            });
            
            gridContainer.appendChild(fragment);
        }

        document.addEventListener('DOMContentLoaded', buildMenu);
    </script>
</body>
</html>
