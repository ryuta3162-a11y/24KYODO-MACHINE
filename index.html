<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYFIT24経堂 - マシンラインナップ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        joyred: '#C21632',
                        joyink: '#111111',
                        joybg: '#FFFFFF',
                        joypanel: '#FFFFFF',
                        joygray: '#E5E5E5',
                        joytext: '#111111',
                        joymuted: '#555555',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --brand-red: #C21632;
            --brand-red-dark: #8a0e20;
            --ink: #111111;
            --muted: #555555;
            --line: #E5E5E5;
            --radius: 0.35rem;
        }
        html { scroll-behavior: smooth; background: #FFFFFF; color: var(--ink); }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
            background: #FFFFFF;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .hero {
            text-align: center;
            padding: 2.75rem 1rem 1.5rem;
            background: #FFFFFF;
            border-bottom: 1px solid var(--line);
        }
        .hero-brand {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: var(--ink);
            margin-bottom: 1rem;
        }
        .hero-title-black {
            margin: 0;
            font-size: clamp(1.45rem, 4.8vw, 2rem);
            font-weight: 900;
            line-height: 1.35;
            color: var(--ink);
        }
        .hero-title-red {
            margin: 0.35rem 0 0;
            font-size: clamp(1.55rem, 5.2vw, 2.15rem);
            font-weight: 900;
            line-height: 1.3;
            color: var(--brand-red);
        }
        .hero-rule {
            width: 100%;
            max-width: 28rem;
            height: 4px;
            margin: 1.15rem auto 0;
            background: var(--brand-red);
            border: none;
        }

        .area-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.55rem 1.1rem;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
        }
        .area-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            background: var(--brand-red);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            border-radius: 0.2rem;
        }

        .machine-card {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.15s ease;
            background: #FFFFFF;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .machine-card.show { opacity: 1; transform: translateY(0); }
        .machine-card:hover { border-color: var(--brand-red); }

        .img-blend {
            mix-blend-mode: multiply;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .menu-btn {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #fff;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .menu-btn:hover { border-color: var(--brand-red); }
        .menu-btn.is-active {
            border-color: var(--brand-red);
            background: #fff5f6;
        }
        .menu-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 0.2rem;
            color: #fff;
            font-weight: 900;
            font-size: 0.8rem;
            flex-shrink: 0;
            background: #888;
        }
        .menu-btn.is-active .menu-num { background: var(--brand-red); }
        .menu-text {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-align: left;
        }
        .menu-btn.is-active .menu-text,
        .menu-btn:hover .menu-text { color: var(--brand-red); }

        #open-sidebar-btn,
        #close-sidebar-btn {
            border: 1px solid var(--ink);
            border-radius: var(--radius);
            background: #fff;
            color: var(--ink);
            box-shadow: none;
        }
        #open-sidebar-btn:hover,
        #close-sidebar-btn:hover { color: var(--brand-red); }

        .sidebar-panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .sidebar-brand {
            border-bottom: 1px solid var(--line);
            background: #fff;
        }
        .sidebar-brand .brand-main {
            color: var(--brand-red);
            font-weight: 900;
            letter-spacing: 0.12em;
        }
        .sidebar-brand .brand-sub {
            color: var(--ink);
            font-weight: 800;
            letter-spacing: 0.12em;
        }
    </style>
</head>
<body class="bg-joybg text-joytext flex min-h-screen overflow-x-hidden selection:bg-joyred selection:text-white">

    <button id="open-sidebar-btn" class="fixed top-4 left-4 z-[60] p-3 hidden group" aria-label="メニューを開く">
        <i data-lucide="menu" class="w-6 h-6"></i>
    </button>

    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-transparent z-[70] flex flex-col transition-transform duration-500 ease-in-out pointer-events-none">
        <div class="h-full w-full p-4 pointer-events-auto flex flex-col">
            <div class="sidebar-panel flex flex-col h-full relative overflow-hidden">
                <button id="close-sidebar-btn" class="absolute top-4 right-4 p-1.5 z-50" aria-label="メニューを閉じる">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>

                <div class="sidebar-brand pt-8 pb-4 flex flex-col items-center justify-center flex-shrink-0">
                    <span class="brand-main text-xl mb-1">JOYFIT24</span>
                    <span class="brand-sub text-sm">経堂</span>
                </div>

                <nav id="area-menu" class="flex flex-col flex-grow p-3 gap-2 overflow-y-auto no-scrollbar">
                    <!-- JSで生成 -->
                </nav>
            </div>
        </div>
    </aside>

    <main id="main-content" class="ml-64 flex-1 min-w-0 flex flex-col transition-all duration-500 ease-in-out relative z-10">
        
        <header class="hero z-20">
            <p class="hero-brand">JOYFIT24 経堂</p>
            <h1 class="hero-title-black">2Fジムエリア</h1>
            <p class="hero-title-red">マシンラインナップ</p>
            <hr class="hero-rule">
        </header>

        <div class="relative z-10 overflow-hidden flex-1">
            <div class="px-3 md:px-10 lg:px-16 py-10 md:py-14 relative z-20">
                <div class="mb-8 md:mb-10 flex flex-col items-center justify-center">
                    <div class="area-chip transition-opacity duration-200">
                        <h2 id="current-area-title" class="text-lg md:text-2xl font-black tracking-widest text-joytext flex items-center gap-3 m-0">
                            <!-- JSで挿入 -->
                        </h2>
                    </div>
                </div>
                
                <div id="machine-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 md:gap-4 relative z-30">
                    <!-- JSで生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const gymData = [
            { id: 'cardio', title: '有酸素マシン', items: [
                { imgBase: 'cardio_1' },
                { imgBase: 'cardio_2' },
                { imgBase: 'cardio_3' }
            ]},
            { id: 'resistance', title: 'ウェイトマシン', items: [
                { imgBase: 'resistance_1' },
                { imgBase: 'resistance_2' },
                { imgBase: 'resistance_3' },
                { imgBase: 'resistance_4' },
                { imgBase: 'resistance_5' },
                { imgBase: 'resistance_6' },
                { imgBase: 'resistance_7' },
                { imgBase: 'resistance_8' },
                { imgBase: 'resistance_9' },
                { imgBase: 'resistance_10' },
                { imgBase: 'resistance_11' },
                { imgBase: 'resistance_12' },
                { imgBase: 'resistance_13' },
                { imgBase: 'resistance_14' },
                { imgBase: 'resistance_15' }
            ]},
            { id: 'freeweight', title: 'フリーウェイト', items: [
                { imgBase: 'freeweight_1' },
                { imgBase: 'freeweight_2' },
                { imgBase: 'freeweight_3' },
                { imgBase: 'freeweight_4' },
                { imgBase: 'freeweight_5' },
                { imgBase: 'freeweight_6' },
                { imgBase: 'freeweight_7' },
                { imgBase: 'freeweight_8' },
                { imgBase: 'freeweight_9' },
                { imgBase: 'freeweight_10' },
                { imgBase: 'freeweight_11' },
                { imgBase: 'freeweight_12' }
            ]}
        ];

        const menuContainer = document.getElementById('area-menu');
        const gridContainer = document.getElementById('machine-grid');
        const titleContainer = document.getElementById('current-area-title');
        
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');
        const openBtn = document.getElementById('open-sidebar-btn');
        const closeBtn = document.getElementById('close-sidebar-btn');

        let currentActiveId = null;

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                if (window.innerWidth >= 768) {
                    mainContent.classList.add('ml-64');
                    mainContent.classList.remove('ml-0');
                }
                openBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                mainContent.classList.remove('ml-64');
                mainContent.classList.add('ml-0');
                openBtn.classList.remove('hidden');
            }
        }

        openBtn.addEventListener('click', () => toggleSidebar(true));
        closeBtn.addEventListener('click', () => toggleSidebar(false));

        if (window.innerWidth < 768) toggleSidebar(false);

        function buildMenu() {
            gymData.forEach((area, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'menu-btn focus:outline-none';
                
                const numText = String(index + 1).padStart(2, '0');
                
                btn.innerHTML = `
                    <div class="relative z-10 px-2 py-2.5 flex items-center justify-start gap-3">
                        <div class="menu-num">${numText}</div>
                        <span class="menu-text">${area.title}</span>
                    </div>
                `;
                
                btn.onclick = () => selectArea(area.id, btn, index);
                menuContainer.appendChild(btn);

                if (index === 0) selectArea(area.id, btn, index);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function selectArea(id, selectedBtn, index) {
            if (currentActiveId === id) return;
            currentActiveId = id;

            const allBtns = menuContainer.querySelectorAll('button');
            allBtns.forEach(btn => {
                if (btn === selectedBtn) {
                    btn.classList.add('is-active');
                } else {
                    btn.classList.remove('is-active');
                }
            });

            const areaData = gymData.find(a => a.id === id);
            const chip = titleContainer.parentElement;
            
            chip.style.opacity = '0';
            setTimeout(() => {
                const numText = String(index + 1).padStart(2, '0');
                titleContainer.innerHTML = `
                    <span class="area-num">${numText}</span>
                    <span class="font-black">${areaData.title}</span>
                `;
                chip.style.opacity = '1';
            }, 160);

            gridContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();

            areaData.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'machine-card group cursor-default';

                let imgHTML = `<img src="${item.imgBase}.jpg" alt="マシン画像" onerror="this.onerror=null;this.src='https://placehold.co/400x300/f4f4f5/999999?text=Image';" class="w-full h-full object-contain p-2 img-blend">`;

                card.innerHTML = `
                    <div class="relative aspect-[4/3] flex items-center justify-center overflow-hidden">
                        ${imgHTML}
                    </div>
                `;

                fragment.appendChild(card);
                setTimeout(() => card.classList.add('show'), 30 * idx);
            });
            
            gridContainer.appendChild(fragment);
        }

        document.addEventListener('DOMContentLoaded', buildMenu);
    </script>
</body>
</html>
